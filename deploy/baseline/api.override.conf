# PROPOSAL ONLY. Substitute BASELINE_ROOT with the fixed, verified release directory.
[Service]
WorkingDirectory=BASELINE_ROOT/backend/source
ExecStart=
ExecStart=BASELINE_ROOT/backend/runtime/bin/python3.13 BASELINE_ROOT/receipt.py launch BASELINE_ROOT /var/lib/vlr-receipts
Environment=PYTHONHOME=BASELINE_ROOT/backend/runtime
Environment=PYTHONPATH=BASELINE_ROOT/backend/source:BASELINE_ROOT/backend/runtime/lib/python3.13/site-packages
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=VLR_ENABLE_SCHEDULER=true
StateDirectory=vlr-receipts
UMask=0077
Restart=no
TimeoutStopSec=100
ReadOnlyPaths=BASELINE_ROOT
