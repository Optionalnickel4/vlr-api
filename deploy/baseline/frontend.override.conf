# PROPOSAL ONLY. Fixed release directory; preserve reviewed external EnvironmentFile.
[Service]
WorkingDirectory=BASELINE_ROOT/frontend
ExecStart=
ExecStart=BASELINE_ROOT/frontend/node BASELINE_ROOT/frontend/node_modules/next/dist/bin/next start -H 0.0.0.0 -p 3000
Environment=NODE_ENV=production
Environment=NEXT_TELEMETRY_DISABLED=1
Environment=VLR_API_BASE=http://127.0.0.1:8000/api/v1
Restart=no
TimeoutStopSec=100
# Bind only .next/cache to a release-specific writable directory if required;
# compiled application files remain root-owned/read-only.
ReadOnlyPaths=BASELINE_ROOT
CacheDirectory=vlr-next-BASELINE_ID
BindPaths=/var/cache/vlr-next-BASELINE_ID:BASELINE_ROOT/frontend/.next/cache
ReadWritePaths=BASELINE_ROOT/frontend/.next/cache
